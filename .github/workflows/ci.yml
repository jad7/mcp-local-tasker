name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
          
      - name: Run tests
        run: pytest --cov=mcp_local_tasker --cov-report=term-missing
      
      - name: Check coverage
        run: |
          coverage=$(pytest --cov=mcp_local_tasker --quiet --cov-report=term-missing 2>/dev/null | grep "TOTAL" | awk '{print $NF}')
          echo "Coverage: $coverage"
          if [[ "${coverage%\%}" -lt 80 ]]; then
            echo "Coverage below 80%"
            exit 1
          fi
